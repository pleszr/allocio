repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: code-map-staged-check
        name: code map staged structural check
        entry: uv run --python 3.14 python tools/code_map.py --check-staged docs/code-map.json
        language: system
        pass_filenames: false
        files: '^(backend/app/|backend/alembic/versions/|tools/.*\.py$|frontend/src/|docs/code-map\.json$)'
      - id: api-workflow-test
        name: api workflow smoke test
        entry: uv run --project backend pytest backend/tests/test_workflow_e2e.py -q
        language: system
        pass_filenames: false
        files: '^(backend/app/|backend/alembic/versions/|backend/tests/test_workflow_e2e\.py)'
