repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: code-map-staged-check
        name: code map staged structural check
        entry: uv run --python 3.14 python tools/code_map.py --check-staged docs/code-map.json
        language: system
        pass_filenames: false
        files: '^(backend/app/|backend/alembic/versions/|tools/.*\.py$|frontend/src/|docs/code-map\.json$)'
      - id: code-map-overview-check
        name: code map architecture overview check
        entry: uv run --python 3.14 python tools/code_map.py --check-overview-html docs/code-map.html
        language: system
        pass_filenames: false
        files: '^(backend/app/|backend/alembic/versions/|tools/.*\.py$|frontend/src/|docs/code-map\.html$)'
