name: claude-review
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
  pull-requests: write
  id-token: write
jobs:
  claude-review:
    runs-on: ubuntu-latest
    # Skip fork PRs: repo secrets (ANTHROPIC_API_KEY) are not available to them,
    # so the run would fail. Own-branch PRs only.
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: anthropics/claude-code-action@v1
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        with:
          prompt: |
            Review the diff of this pull request against origin/${{ github.base_ref }}.
            Follow the repository's own review guidance in
            .claude/skills/code-review/SKILL.md and its references. Prioritize
            correctness, regressions, security, FastAPI/SQLAlchemy reliability,
            React/TypeScript maintainability, and test impact.
            Post findings as a single PR review comment, most-severe first.
            Do not modify code. If nothing material is wrong, say so briefly.
