name: structural-diff
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
  pull-requests: write
jobs:
  structural-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: astral-sh/setup-uv@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        run: cd frontend && npm install

      - name: Check code map is current
        run: uv run --python 3.14 python tools/code_map.py --check docs/code-map.json

      - name: Check architecture overview is current
        run: uv run --python 3.14 python tools/code_map.py --check-overview-html docs/code-map.html

      - name: Generate structural diff for the PR range
        run: |
          uv run --python 3.14 python tools/code_map.py \
            --diff "origin/${{ github.base_ref }}...HEAD" \
            --format markdown > structural-diff.md
          cat structural-diff.md

      - name: Post or update the structural-changes comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # Upsert a single sticky comment identified by the marker, so every
          # push refreshes it in place instead of piling up new comments.
          id="$(gh api "repos/${REPO}/issues/${PR}/comments" --paginate \
            --jq '.[] | select(.body | contains("<!-- structural-changes:start -->")) | .id' \
            | head -n1)"
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/${REPO}/issues/comments/${id}" \
              -F body=@structural-diff.md
          else
            gh api --method POST "repos/${REPO}/issues/${PR}/comments" \
              -F body=@structural-diff.md
          fi
